submission:
  title: "SupplyGuard AI"

  problem_statement: >
    Global supply chain operations teams lack real-time unified intelligence to
    correlate disruptions with shipment impact, optimise fleet utilisation, and
    detect cold-chain temperature excursions before cargo integrity is lost,
    costing enterprises hundreds of millions annually in delays, spoilage, and
    missed SLAs.

  solution_summary: >
    SupplyGuard AI is an intelligent logistics control tower that correlates
    active disruptions with shipment routes to calculate live risk scores,
    recommends alternative routes and carriers, detects and redeploys idle
    fleet assets, monitors cold-chain IoT telemetry to detect and classify
    temperature excursions before delivery, and provides a natural-language
    IBM Bob Copilot powered by a 10-tool MCP server for conversational
    supply chain intelligence.

  key_features:
    - "Real-time disruption impact analysis with transparent risk scoring (0-100) and per-factor breakdown"
    - "AI route and carrier recommendation engine comparing cost, delay, reliability and disruption exposure"
    - "Fleet utilisation optimizer detecting idle assets and calculating redeployment benefit"
    - "Cold-chain IoT excursion detection engine classifying severity (MINOR/MAJOR/CRITICAL) from 500+ sensor readings"
    - "IBM Bob MCP Copilot with 10 load-bearing tools for conversational supply chain intelligence"

  tech_stack:
    languages: ["TypeScript", "JavaScript"]
    frameworks: ["React", "Vite", "Express", "Tailwind CSS", "Recharts"]
    ibm_technologies: ["IBM Bob", "Model Context Protocol (MCP)"]
    databases: ["In-memory JSON state (demo)", "SQLite-compatible architecture"]
    other: ["Lucide React", "Zod", "Axios", "React Router", "ts-node", "Jest", "ts-jest"]

  what_we_are_most_proud_of: >
    The IBM Bob MCP integration is genuinely load-bearing — every intelligence
    engine is accessible as a real MCP tool, meaning Bob can query live
    disruption data, analyze shipment risk with actual scoring logic, and
    recommend fleet redeployments from real application state. The cold-chain
    excursion engine processes 500+ realistic IoT readings with configurable
    severity thresholds and a full time-series analysis, not hardcoded results.

  known_limitations: >
    Runs entirely on synthetic demo data — not connected to live logistics APIs
    or IoT platforms. Cold-chain severity thresholds are configurable demo rules
    and must be validated against actual regulatory/product requirements before
    production use. Authentication and multi-user session management are not
    implemented. The MCP server requires a locally running IBM Bob instance.

